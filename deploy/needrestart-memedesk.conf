# MemeDesk: do not automatically restart these services after library upgrades
# (unattended-upgrades / needrestart). A restart with open paper positions would
# interrupt live risk management. Use /usr/local/sbin/memedesk-safe-restart.
# Add to the existing override hash; do not replace $nrconf{override_rc}.
$nrconf{override_rc}->{qr(^memedesk)} = 0;
